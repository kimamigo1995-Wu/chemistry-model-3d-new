          self.skipWaiting();
        });
        self.addEventListener('activate', e=>{
          e.waitUntil(caches.keys().then(ks=>Promise.all(
            ks.filter(k=>k!==CACHE).map(k=>caches.delete(k))
          )));
          self.clients.claim();
        });
        self.addEventListener('fetch', e=>{
          e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request).then(res=>{

  <!-- 主程式 -->
  <script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useCallback } = React;

/* ══════════════════════════ MATH ══════════════════════════════════ */
const vn=v=>{const l=Math.sqrt(v[0]**2+v[1]**2+v[2]**2);return l>1e-9?v.map(x=>x/l):v};
const va=(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]];
const vs=(v,s)=>v.map(x=>x*s);
const vc=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const vp=v=>{const n=vn(v);const r=Math.abs(n[1])<0.8?[0,1,0]:[1,0,0];return vn(vc(n,r))};
const vsub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]];

// Generate n tetrahedral positions around center.
// "toward" = direction from center TOWARD an existing bonded neighbor.
// Each generated position forms 109.47° with that direction.
function T(center,toward,bl=1.09,n=3,ph=0){
  const e1=vn(toward),e2=vp(e1),e3=vn(vc(e1,e2));
  const ct=-1/3,st=Math.sqrt(8/9);
  return Array.from({length:n},(_,k)=>{
    const p=ph+k*2*Math.PI/3;
    return va(center,vs([
      ct*e1[0]+st*(Math.cos(p)*e2[0]+Math.sin(p)*e3[0]),
      ct*e1[1]+st*(Math.cos(p)*e2[1]+Math.sin(p)*e3[1]),
      ct*e1[2]+st*(Math.cos(p)*e2[2]+Math.sin(p)*e3[2])
    ],bl));
  });
}

// sp2 group direction constants (xy plane)
// C=O at +y (90°), substituents at 210° and 330°
const D210=[Math.cos(7*Math.PI/6),Math.sin(7*Math.PI/6),0]; // (-0.866,-0.500, 0)
const D330=[Math.cos(11*Math.PI/6),Math.sin(11*Math.PI/6),0]; // ( 0.866,-0.500, 0)
const D60 =Math.PI/3;

/* ══════════════════════════ ELEMENTS ══════════════════════════════ */
const EL={
  H:{col:0xE8E8E8,r:0.28,zh:'氫 H'}, C:{col:0x282828,r:0.37,zh:'碳 C'},
  N:{col:0x2244EE,r:0.36,zh:'氮 N'}, O:{col:0xFF1100,r:0.34,zh:'氧 O'},
  F:{col:0x33AA33,r:0.30,zh:'氟 F'}, Cl:{col:0x22CC22,r:0.45,zh:'氯 Cl'},
  Br:{col:0xBB2200,r:0.50,zh:'溴 Br'},I:{col:0x881188,r:0.60,zh:'碘 I'},
  S:{col:0xDDCC00,r:0.53,zh:'硫 S'}, P:{col:0xFF8000,r:0.55,zh:'磷 P'},
};

/* ══════════════════════════ PACKAGING ═════════════════════════════ */
function pkg(name,formula,note,atoms,bonds){
  const n=atoms.length;
  const cx=atoms.reduce((s,a)=>s+a[1],0)/n;
  const cy=atoms.reduce((s,a)=>s+a[2],0)/n;
  const cz=atoms.reduce((s,a)=>s+a[3],0)/n;
  return{name,formula,note,
    atoms:atoms.map(([e,x,y,z])=>[e,+(x-cx).toFixed(4),+(y-cy).toFixed(4),+(z-cz).toFixed(4)]),
    bonds};
}

/* ══════════════════════════ CHAIN HELPERS ═════════════════════════ */
// Zigzag C positions in xz plane. C[i] at (i*1.277, 0, (i%2)*0.861)
function zigC(n){return Array.from({length:n},(_,i)=>[i*1.277,0,(i%2)*0.861]);}

// For an internal sp3 carbon at pos[i] with chain neighbors at pos[i-1] and pos[i+1],
// returns 2 H positions (above/below the xz plane).
// Uses geometric sum: d1+d2+dH1+dH2=0, so dH1=(0,+hy,hz), dH2=(0,-hy,hz)
function internalCH2(Ci,prevPos,nextPos){
  const d1=vn(vsub(prevPos,Ci)),d2=vn(vsub(nextPos,Ci));
  const s=va(d1,d2); // ≈ (0, 0, ±1.118)
  const hz=-s[2]/2; const hy=Math.sqrt(Math.max(0,1-hz*hz));
  return[[Ci[0],hy*1.09,Ci[2]+hz*1.09],[Ci[0],-hy*1.09,Ci[2]+hz*1.09]];
}

// Add H atoms to all carbons in a zigzag chain, skipping indices in skipSet.
// Terminal C → 3H, Internal C → 2H
function addChainH(atoms,bonds,pos,skipSet){
  const n=pos.length;
  for(let i=0;i<n;i++){
    if(skipSet&&skipSet.has(i)) continue;
    const ci=i; // carbon index in atoms[] matches chain index if no extra atoms before chain
    if(i===0||i===n-1){
      const nbr=pos[i===0?1:n-2];
      T(pos[i],vn(vsub(nbr,pos[i])),1.09,3).forEach(h=>{bonds.push([ci,atoms.length,1]);atoms.push(['H',...h]);});
    }else{
      internalCH2(pos[i],pos[i-1],pos[i+1]).forEach(h=>{bonds.push([ci,atoms.length,1]);atoms.push(['H',...h]);});
    }
  }
}

/* ══════════════════════════ ALKANE BUILDER ════════════════════════ */
function mkAlkane(n,name,formula,note){
  const pos=zigC(n),atoms=[],bonds=[];
  pos.forEach(p=>atoms.push(['C',...p]));
  for(let i=0;i<n-1;i++) bonds.push([i,i+1,1]);
  addChainH(atoms,bonds,pos,null);
  return pkg(name,formula,note,atoms,bonds);
}

/* ══════════════════════════ ALCOHOL BUILDERS ══════════════════════ */
// Primary 1-alkanol: OH on terminal C[0]
function mk1Alcohol(n,name,formula,note){
  const pos=zigC(n),atoms=[],bonds=[];
  pos.forEach(p=>atoms.push(['C',...p]));
  for(let i=0;i<n-1;i++) bonds.push([i,i+1,1]);
  if(n===1){
    // Methanol: place O directly along +x so C has 4 proper tetrahedral bonds
    const O=[1.43,0,0];
    const oI=atoms.length; bonds.push([0,oI,1]); atoms.push(['O',...O]);
    bonds.push([oI,atoms.length,1]); atoms.push(['H',...T(O,[-1,0,0],0.96,1,0)[0]]);
    // 3H on C at 109.5° from C→O direction
    T(pos[0],[1,0,0],1.09,3).forEach(h=>{bonds.push([0,atoms.length,1]);atoms.push(['H',...h]);});
    return pkg(name,formula,note,atoms,bonds);
  }
  // n≥2: OH on C[0]
  const tw=vn(vsub(pos[1],pos[0]));
  const O=T(pos[0],tw,1.43,1,0)[0]; // O at tetrahedral phi=0
  const oI=atoms.length; bonds.push([0,oI,1]); atoms.push(['O',...O]);
  const H_O=T(O,vn(vsub(pos[0],O)),0.96,1,0)[0];
  bonds.push([oI,atoms.length,1]); atoms.push(['H',...H_O]);
  T(pos[0],tw,1.09,2,2*Math.PI/3).forEach(h=>{bonds.push([0,atoms.length,1]);atoms.push(['H',...h]);}); // 2H on C[0]
  addChainH(atoms,bonds,pos,new Set([0])); // 3H on terminal, 2H on internal (skip C[0])
  return pkg(name,formula,note,atoms,bonds);
}

// Secondary 2-alkanol: OH on C[1] (n≥3)
function mk2Alcohol(n,name,formula,note){
  const pos=zigC(n),atoms=[],bonds=[];
  pos.forEach(p=>atoms.push(['C',...p]));
  for(let i=0;i<n-1;i++) bonds.push([i,i+1,1]);
  // OH on C[1] using symmetric placement
  const d1=vn(vsub(pos[0],pos[1])),d2=vn(vsub(pos[2],pos[1]));
  const s=va(d1,d2); const hz=-s[2]/2; const hy=Math.sqrt(Math.max(0,1-hz*hz));
  const O=va(pos[1],vs([0,hy,hz],1.43));
  const H_c=va(pos[1],vs([0,-hy,hz],1.09));
  const oI=atoms.length; bonds.push([1,oI,1]); atoms.push(['O',...O]);
  bonds.push([oI,atoms.length,1]); atoms.push(['H',...T(O,vn(vsub(pos[1],O)),0.96,1,0)[0]]);
  bonds.push([1,atoms.length,1]); atoms.push(['H',...H_c]);
  addChainH(atoms,bonds,pos,new Set([1]));
  return pkg(name,formula,note,atoms,bonds);
}

/* ══════════════════════════ SP2 CHAIN HELPER ══════════════════════ */
// Cleaner sp2 chain: returns {chain:[], startIdx} where startIdx is atoms index of first chain C
function sp2chain(sp2C,dir,nC,sp2cIdx,atoms,bonds){
  const chain=[];
  const startIdx=atoms.length;
  const C1=va(sp2C,vs(dir,1.52));
  chain.push(C1);atoms.push(['C',...C1]);bonds.push([sp2cIdx,startIdx,1]);
  for(let k=1;k<nC;k++){
    const prev=chain[k-1];
    const tw=vn(vsub(k===1?sp2C:chain[k-2],prev));
    const nextC=T(prev,tw,1.54,1,0)[0];
    chain.push(nextC);atoms.push(['C',...nextC]);bonds.push([atoms.length-2,atoms.length-1,1]);
  }
  // H on each chain C
  for(let k=0;k<nC;k++){
    const Ci=chain[k];const ci=startIdx+k;
    const prev=k===0?sp2C:chain[k-1];
    const tw=vn(vsub(prev,Ci));
    const isLast=k===nC-1;
    T(Ci,tw,1.09,isLast?3:2,isLast?0:2*Math.PI/3).forEach(h=>{bonds.push([ci,atoms.length,1]);atoms.push(['H',...h]);});
  }
  return chain;
}

/* ══════════════════════════ ALDEHYDE BUILDER ══════════════════════ */
// n = total C count (1=formaldehyde, 2=acetaldehyde, ...)
function mkAldehyde(n,name,formula,note){
  if(n===1) return pkg(name,formula,note,
    [['C',0,0,0],['O',0,1.21,0],['H',0.966,-0.558,0],['H',-0.966,-0.558,0]],
    [[0,1,2],[0,2,1],[0,3,1]]);
  const atoms=[],bonds=[];
  atoms.push(['C',0,0,0],['O',0,1.22,0],['H',...vs(D330,1.09)]); // 0=sp2C, 1=O, 2=Hald
  bonds.push([0,1,2],[0,2,1]);
  sp2chain([0,0,0],D210,n-1,0,atoms,bonds);
  return pkg(name,formula,note,atoms,bonds);
}

/* ══════════════════════════ KETONE BUILDER ════════════════════════ */
// nL = left chain C count, nR = right chain C count
function mkKetone(nL,nR,name,formula,note){
  const atoms=[],bonds=[];
  atoms.push(['C',0,0,0],['O',0,1.22,0]); bonds.push([0,1,2]);
  sp2chain([0,0,0],D210,nL,0,atoms,bonds);
  sp2chain([0,0,0],D330,nR,0,atoms,bonds);
  return pkg(name,formula,note,atoms,bonds);
}

/* ══════════════════════════ ACID BUILDER ══════════════════════════ */
// n = total C count (1=formic, 2=acetic, ...)
function mkAcid(n,name,formula,note){
  const atoms=[],bonds=[];
  const Ooh=vs(D210,1.34); const Hoh=va(Ooh,vs(D210,0.97));
  atoms.push(['C',0,0,0],['O',0,1.23,0],['O',...Ooh],['H',...Hoh]);
  bonds.push([0,1,2],[0,2,1],[2,3,1]);
  if(n===1){atoms.push(['H',...vs(D330,1.09)]);bonds.push([0,4,1]);}
  else sp2chain([0,0,0],D330,n-1,0,atoms,bonds);
  return pkg(name,formula,note,atoms,bonds);
}

/* ══════════════════════════ ESTER BUILDER ═════════════════════════ */
// nAcyl = acyl chain length (including sp2 C), nAlk = alkoxy chain length
function mkEster(nAcyl,nAlk,name,formula,note){
  const atoms=[],bonds=[];
  const Oe=vs(D210,1.34);
  atoms.push(['C',0,0,0],['O',0,1.22,0],['O',...Oe]);
  bonds.push([0,1,2],[0,2,1]);
  // Acyl chain at 330°
  if(nAcyl===1){atoms.push(['H',...vs(D330,1.09)]);bonds.push([0,atoms.length-1,1]);}
  else sp2chain([0,0,0],D330,nAcyl-1,0,atoms,bonds);
  // Alkoxy chain from ester O at 210°
  sp2chain(Oe,D210,nAlk,2,atoms,bonds);
  return pkg(name,formula,note,atoms,bonds);
}

/* ══════════════════════════ ETHER BUILDER ═════════════════════════ */
function mkEther(n1,n2,name,formula,note){
  const pos1=zigC(n1),pos2=zigC(n2);
  const atoms=[],bonds=[];
  // O at origin, C1-chain at left, C2-chain at right, angle ~112°
  const ang=56*Math.PI/180;
  const d1=[-Math.sin(ang),0,-Math.cos(ang)],d2=[Math.sin(ang),0,-Math.cos(ang)];
  atoms.push(['O',0,0,0]);
  // chain1: C positions attached to O at d1 direction
  const chain1=[va([0,0,0],vs(d1,1.43))];
  atoms.push(['C',...chain1[0]]);bonds.push([0,1,1]);
  for(let k=1;k<n1;k++){
    const tw=vn(vsub(k===1?[0,0,0]:chain1[k-2],chain1[k-1]));
    const nextC=T(chain1[k-1],tw,1.54,1,0)[0];
    chain1.push(nextC);atoms.push(['C',...nextC]);bonds.push([atoms.length-2,atoms.length-1,1]);
  }
  // chain2
  const chain2=[va([0,0,0],vs(d2,1.43))];
  const c2Start=atoms.length;
  atoms.push(['C',...chain2[0]]);bonds.push([0,c2Start,1]);
  for(let k=1;k<n2;k++){
    const tw=vn(vsub(k===1?[0,0,0]:chain2[k-2],chain2[k-1]));
    const nextC=T(chain2[k-1],tw,1.54,1,0)[0];
    chain2.push(nextC);atoms.push(['C',...nextC]);bonds.push([atoms.length-2,atoms.length-1,1]);
  }
  // H on chain1
  for(let k=0;k<n1;k++){
    const Ci=chain1[k],ci=1+k;
    const prev=k===0?[0,0,0]:chain1[k-1];
    const tw=vn(vsub(prev,Ci));
    T(Ci,tw,1.09,k===n1-1?3:2,k===n1-1?0:2*Math.PI/3).forEach(h=>{bonds.push([ci,atoms.length,1]);atoms.push(['H',...h]);});
  }
  // H on chain2
  for(let k=0;k<n2;k++){
    const Ci=chain2[k],ci=c2Start+k;
    const prev=k===0?[0,0,0]:chain2[k-1];
    const tw=vn(vsub(prev,Ci));
    T(Ci,tw,1.09,k===n2-1?3:2,k===n2-1?0:2*Math.PI/3).forEach(h=>{bonds.push([ci,atoms.length,1]);atoms.push(['H',...h]);});
  }
  return pkg(name,formula,note,atoms,bonds);
}

/* ══════════════════════════ BENZENE BUILDER ═══════════════════════ */
// subs[6]: 'H'|'CH3'|'C2H5'|'OH'|'F'|'Cl'|'Br'|'NO2'|'CHO'|'COOH'|'NH2'
function benzPkg(name,formula,note,subs){
  const R=1.40,atoms=[],bonds=[];
  for(let i=0;i<6;i++){const a=i*Math.PI/3;atoms.push(['C',R*Math.cos(a),0,R*Math.sin(a)]);}
  for(let i=0;i<6;i++) bonds.push([i,(i+1)%6,i%2===0?2:1]);
  for(let i=0;i<6;i++){
    const a=i*Math.PI/3,cp=[R*Math.cos(a),0,R*Math.sin(a)],rd=[Math.cos(a),0,Math.sin(a)];
    const sub=(subs&&subs[i])||'H',xi=atoms.length;
    if(sub==='H'){
      atoms.push(['H',...va(cp,vs(rd,1.09))]);bonds.push([i,xi,1]);
    }else if(sub==='CH3'){
      const mc=va(cp,vs(rd,1.51));atoms.push(['C',...mc]);bonds.push([i,xi,1]);
      // FIX: toward = direction from methyl C TOWARD ring C = -rd (not +rd)
      T(mc,vs(rd,-1),1.09,3).forEach(h=>{bonds.push([xi,atoms.length,1]);atoms.push(['H',...h]);});
    }else if(sub==='C2H5'){
      const Ca=va(cp,vs(rd,1.51));atoms.push(['C',...Ca]);bonds.push([i,xi,1]);
      // Cb at tetrahedral from Ca toward ring C: toward = -rd (from Ca toward ring)
      const Cb=T(Ca,vs(rd,-1),1.54,1,0)[0];atoms.push(['C',...Cb]);bonds.push([xi,xi+1,1]);
      T(Ca,vs(rd,-1),1.09,2,2*Math.PI/3).forEach(h=>{bonds.push([xi,atoms.length,1]);atoms.push(['H',...h]);});
      T(Cb,vn(vsub(Ca,Cb)),1.09,3).forEach(h=>{bonds.push([xi+1,atoms.length,1]);atoms.push(['H',...h]);});
    }else if(sub==='OH'){
      const op=va(cp,vs(rd,1.36));atoms.push(['O',...op]);bonds.push([i,xi,1]);
      atoms.push(['H',...va(op,vs(vn([rd[0]*0.35,0.93,rd[2]*0.35]),0.96))]);bonds.push([xi,xi+1,1]);
    }else if(sub==='F'){
      atoms.push(['F',...va(cp,vs(rd,1.35))]);bonds.push([i,xi,1]);
    }else if(sub==='Cl'){
      atoms.push(['Cl',...va(cp,vs(rd,1.74))]);bonds.push([i,xi,1]);
    }else if(sub==='Br'){
      atoms.push(['Br',...va(cp,vs(rd,1.90))]);bonds.push([i,xi,1]);
    }else if(sub==='NO2'){
      const np=va(cp,vs(rd,1.48));atoms.push(['N',...np]);bonds.push([i,xi,1]);
      atoms.push(['O',...va(np,[1.22*Math.cos(a+D60),0,1.22*Math.sin(a+D60)])]);bonds.push([xi,xi+1,2]); // N=O double
      atoms.push(['O',...va(np,[1.22*Math.cos(a-D60),0,1.22*Math.sin(a-D60)])]);bonds.push([xi,xi+2,1]); // N-O single
    }else if(sub==='CHO'){
      const Cc=va(cp,vs(rd,1.47));atoms.push(['C',...Cc]);bonds.push([i,xi,1]);
      atoms.push(['O',...va(Cc,[1.22*Math.cos(a-D60),0,1.22*Math.sin(a-D60)])]);bonds.push([xi,xi+1,2]);
      atoms.push(['H',...va(Cc,[1.09*Math.cos(a+D60),0,1.09*Math.sin(a+D60)])]);bonds.push([xi,xi+2,1]);
    }else if(sub==='COOH'){
      const Cc=va(cp,vs(rd,1.47));atoms.push(['C',...Cc]);bonds.push([i,xi,1]);
      const ddo=[Math.cos(a-D60),0,Math.sin(a-D60)],doh=[Math.cos(a+D60),0,Math.sin(a+D60)];
      const Ooh=va(Cc,vs(doh,1.34));
      atoms.push(['O',...va(Cc,vs(ddo,1.22))]);bonds.push([xi,xi+1,2]);
      atoms.push(['O',...Ooh]);bonds.push([xi,xi+2,1]);
      atoms.push(['H',...va(Ooh,vs(doh,0.97))]);bonds.push([xi+2,xi+3,1]);
    }else if(sub==='NH2'){
      const np=va(cp,vs(rd,1.40));atoms.push(['N',...np]);bonds.push([i,xi,1]);
      atoms.push(['H',...va(np,vs(vn([rd[0],1.2,rd[2]+0.4]),1.01))]);bonds.push([xi,xi+1,1]);
      atoms.push(['H',...va(np,vs(vn([rd[0],1.2,rd[2]-0.4]),1.01))]);bonds.push([xi,xi+2,1]);
    }
  }
  return pkg(name,formula,note,atoms,bonds);
}

/* ══════════════════════════ BOND ANGLE HELPER ═════════════════════ */
// Computes all bond angles at every atom with 2+ bonds.
// Returns array of {pos:[x,y,z], label:'xxx.x°'}
function computeAngles(mol){
  const res=[];
  mol.atoms.forEach(([,cx,cy,cz],ci)=>{
    const nb=mol.bonds.filter(([i,j])=>i===ci||j===ci).map(([i,j])=>i===ci?j:i);
    if(nb.length<2) return;
    for(let a=0;a<nb.length;a++) for(let b=a+1;b<nb.length;b++){
      const [,ax,ay,az]=mol.atoms[nb[a]],[,bx,by,bz]=mol.atoms[nb[b]];
      const v1=vn([ax-cx,ay-cy,az-cz]),v2=vn([bx-cx,by-cy,bz-cz]);
      const d=Math.max(-1,Math.min(1,v1[0]*v2[0]+v1[1]*v2[1]+v1[2]*v2[2]));
      res.push({
        pos:[cx+(ax+bx-2*cx)*0.42, cy+(ay+by-2*cy)*0.42, cz+(az+bz-2*cz)*0.42],
        label:(Math.acos(d)*180/Math.PI).toFixed(1)+'°'
      });
    }
  });
  return res;
}

/* ══════════════════════════ THREE.JS VIEWER ═══════════════════════ */
const BOND_R=0.055, BOND_OFF=0.095;

// Build molecule geometry into a pivot (atoms + bonds only, no LP objects).
// LP positions are handled as CSS overlay — same as angle labels.
function buildMolScene(pivot, mol){
  mol.atoms.forEach(([el,x,y,z])=>{
    const ed=EL[el]||EL.H;
    const m=new THREE.Mesh(
      new THREE.SphereGeometry(ed.r*1.2,24,24),
      new THREE.MeshPhongMaterial({color:ed.col,shininess:90,specular:0x333333})
    );
    m.position.set(x,y,z); pivot.add(m);
  });
  mol.bonds.forEach(([i,j,order])=>{
    const[,ax,ay,az]=mol.atoms[i],[,bx,by,bz]=mol.atoms[j];
    drawBond(pivot,new THREE.Vector3(ax,ay,az),new THREE.Vector3(bx,by,bz),order);
  });
}

function drawBond(scene,A,B,order){
  const dir=B.clone().sub(A);const len=dir.length();
  if(len<0.01) return;
  const mid=A.clone().add(B).multiplyScalar(0.5);
  const dn=dir.clone().normalize();
  const q=new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,1,0),dn);
  const ref=Math.abs(dn.y)<0.8?new THREE.Vector3(0,1,0):new THREE.Vector3(1,0,0);
  const perp=new THREE.Vector3().crossVectors(dn,ref).normalize();
  const mat=new THREE.MeshPhongMaterial({color:0x888888,shininess:40});
  const r=BOND_R*(order>1?0.68:1);
  const offs=order===1?[[0]]:order===2?[[-BOND_OFF],[BOND_OFF]]:[[-BOND_OFF*1.2],[0],[BOND_OFF*1.2]];
  offs.forEach(([off])=>{
    const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,len,8),mat.clone());
    m.quaternion.copy(q);
    m.position.copy(mid).addScaledVector(perp,off);
    scene.add(m);
  });
}

/* ── Viewer ── */
function Viewer({mol, showAngles}){
  const wrapRef=useRef(null);
  const canvasRef=useRef(null);
  const angOverlayRef=useRef(null);
  const propsRef=useRef({showAngles});
  propsRef.current={showAngles};
  const anglesRef=useRef([]);
  const S=useRef({renderer:null,scene:null,camera:null,animId:null,
    drag:false,lx:0,ly:0,rx:0.3,ry:0.4,zoom:7,pivot:null});

  // ── Effect A: create renderer + camera + scene ONCE ──────────────────
  useEffect(()=>{
    const canvas=canvasRef.current, wrap=wrapRef.current;
    if(!canvas||!wrap) return;
    const s=S.current;
    const W=wrap.clientWidth||600, H=wrap.clientHeight||400;
    s.renderer=new THREE.WebGLRenderer({canvas,antialias:true});
    s.renderer.setSize(W,H); s.renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
    s.renderer.setClearColor(0x0a0d14,1);
    s.scene=new THREE.Scene();
    s.camera=new THREE.PerspectiveCamera(45,W/H,0.1,200);
    s.zoom=7; s.rx=0.3; s.ry=0.4;
    s.pivot=new THREE.Object3D();
    s.scene.add(new THREE.AmbientLight(0x505050,2.0));
    const dl=new THREE.DirectionalLight(0xffffff,2.2); dl.position.set(5,8,5); s.scene.add(dl);
    const dl2=new THREE.DirectionalLight(0x8899cc,0.7); dl2.position.set(-5,-3,-5); s.scene.add(dl2);
    s.scene.add(s.pivot);
    const ro=new ResizeObserver(([e])=>{
      const{width:w,height:h}=e.contentRect;
      if(w>0&&h>0){s.renderer.setSize(w,h);s.camera.aspect=w/h;s.camera.updateProjectionMatrix();}
    });
    ro.observe(wrap);

    function render(){
      s.animId=requestAnimationFrame(render);
      s.camera.position.set(0,0,s.zoom); s.camera.lookAt(0,0,0);
      s.pivot.rotation.x=s.rx; s.pivot.rotation.y=s.ry;
      s.renderer.render(s.scene,s.camera);
      const W2=wrap.clientWidth, H2=wrap.clientHeight;

      // ── Angle overlay ─────────────────────────────────────────────────
      const angOv=angOverlayRef.current;
      if(!angOv) return;
      if(!propsRef.current.showAngles||anglesRef.current.length===0){
        if(angOv.children.length>0) angOv.innerHTML=''; return;
      }
      const angs=anglesRef.current;
      while(angOv.children.length<angs.length){
        const sp=document.createElement('span');
        sp.style.cssText='position:absolute;pointer-events:none;font-size:11px;font-weight:700;'+
          'color:#fbbf24;background:rgba(0,0,0,0.72);padding:1px 5px;border-radius:4px;'+
          'transform:translate(-50%,-50%);white-space:nowrap;border:1px solid rgba(251,191,36,0.3)';
        angOv.appendChild(sp);
      }
      while(angOv.children.length>angs.length) angOv.removeChild(angOv.lastChild);
      angs.forEach((a,k)=>{
        const v=new THREE.Vector3(...a.pos).applyMatrix4(s.pivot.matrixWorld);
        v.project(s.camera);
        const lbl=angOv.children[k];
        lbl.textContent=a.label;
        lbl.style.left=((v.x+1)*W2/2)+'px';
        lbl.style.top=((-v.y+1)*H2/2)+'px';
        lbl.style.display=v.z<1?'inline':'none';
      });
    }
    render();
    return()=>{
      cancelAnimationFrame(s.animId); ro.disconnect(); s.renderer.dispose();
      if(angOverlayRef.current) angOverlayRef.current.innerHTML='';
    };
  },[]);

  // ── Effect B: rebuild when mol changes ───────────────────────────────
  useEffect(()=>{
    const s=S.current;
    if(!s.pivot||!mol) return;
    while(s.pivot.children.length>0) s.pivot.remove(s.pivot.children[0]);
    buildMolScene(s.pivot, mol);
    anglesRef.current=computeAngles(mol);
    s.zoom=7; s.rx=0.3; s.ry=0.4;
  },[mol]);

  const onMD=useCallback(e=>{const s=S.current;s.drag=true;s.lx=e.clientX;s.ly=e.clientY;},[]);
  const onMM=useCallback(e=>{const s=S.current;if(!s.drag)return;s.ry+=(e.clientX-s.lx)*0.008;s.rx+=(e.clientY-s.ly)*0.008;s.lx=e.clientX;s.ly=e.clientY;},[]);
  const onMU=useCallback(()=>{S.current.drag=false;},[]);
  const onWheel=useCallback(e=>{e.preventDefault();S.current.zoom=Math.max(3,Math.min(20,S.current.zoom+e.deltaY*0.01));},[]);
  const onTS=useCallback(e=>{if(e.touches.length===1){const s=S.current;s.drag=true;s.lx=e.touches[0].clientX;s.ly=e.touches[0].clientY;}},[]);
  const onTM=useCallback(e=>{e.preventDefault();if(e.touches.length===1){const s=S.current;if(!s.drag)return;s.ry+=(e.touches[0].clientX-s.lx)*0.01;s.rx+=(e.touches[0].clientY-s.ly)*0.01;s.lx=e.touches[0].clientX;s.ly=e.touches[0].clientY;}},[]);

  return(
    <div ref={wrapRef} style={{width:'100%',height:'100%',position:'relative'}}>
      <canvas ref={canvasRef} style={{width:'100%',height:'100%',display:'block',cursor:'grab',touchAction:'none'}}
        onMouseDown={onMD} onMouseMove={onMM} onMouseUp={onMU} onMouseLeave={onMU}
        onWheel={onWheel} onTouchStart={onTS} onTouchMove={onTM} onTouchEnd={onMU}/>
      <div ref={angOverlayRef} style={{position:'absolute',inset:0,pointerEvents:'none',overflow:'hidden'}}/>
    </div>
  );
}

/* ══════════════════════════ APP UI ════════════════════════════════ */
const ICONS={'無機小分子':'⚗️','烷烴':'⛓️','烯烴與炔烴':'⚡','苯環與芳香烴':'⬡',
  '鹵化物':'🟢','醇類':'🥃','醛類':'🫙','酮類':'🔥','羧酸':'🧪','酯類':'🌸',
  '醚類':'💧','酚類':'🌿','順反異構物':'↔️','鄰間對異構物':'🔀','含硫磷無機分子':'🌡️'};

const LEGEND=[['H','氫','#E8E8E8'],['C','碳','#444'],['N','氮','#2244EE'],
  ['O','氧','#FF1100'],['F','氟','#33AA33'],['Cl','氯','#22CC22'],
  ['Br','溴','#BB2200'],['I','碘','#881188'],['S','硫','#DDCC00'],['P','磷','#FF8000']];

function App(){
  const cats=Object.keys(CAT);
  const [openCat,setOpenCat]=useState(cats[0]);
  const [selMol,setSelMol]=useState(CAT[cats[0]][0]);
  const [showAngles,setShowAngles]=useState(false);
  const [sidebarOpen,setSidebarOpen]=useState(()=>typeof window!=='undefined'&&window.innerWidth>640);
  const [installDismissed,setInstallDismissed]=useState(false); // install banner dismissed?

  function toggleCat(c){
    if(openCat===c){setOpenCat(null);}
    else{setOpenCat(c);setSelMol(CAT[c][0]);}
  }

  // Detect iOS Safari (needs manual "Add to Home Screen")
  const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent)&&!window.MSStream;
  const isInStandaloneMode=window.navigator.standalone===true||window.matchMedia('(display-mode: standalone)').matches;

  return(
    <div style={{display:'flex',flexDirection:'column',height:'100vh',background:'#0a0d14',color:'#e2e8f0',
      fontFamily:"'Noto Sans TC','Segoe UI',sans-serif",overflow:'hidden'}}>

      {/* ══ 安裝橫幅（頂部，可關閉）══════════════════════════════════ */}
      {!installDismissed&&!isInStandaloneMode&&(
        <div style={{background:'linear-gradient(90deg,#0f2050,#1a3a6e)',borderBottom:'1px solid #1e3a7e',
          padding:'7px 14px',display:'flex',alignItems:'center',gap:10,flexShrink:0,zIndex:300}}>
          <span style={{fontSize:18}}>⚗️</span>
          <div style={{flex:1,minWidth:0}}>
            {isIOS
              ? <span style={{fontSize:12,color:'#93c5fd'}}>
                  iPhone/iPad 安裝：點 Safari 底部 <strong style={{color:'#fff'}}>「分享」</strong> → <strong style={{color:'#fff'}}>「加入主畫面」</strong>
                </span>
              : <span style={{fontSize:12,color:'#93c5fd'}}>
                  點選右側按鈕可將本程式安裝到桌面，下次直接從圖示開啟
                </span>
            }
          </div>
          {!isIOS&&(
            <button id="react-install-btn"
              style={{background:'#2563eb',color:'#fff',border:'none',borderRadius:8,
                padding:'5px 14px',fontSize:12,fontWeight:700,cursor:'pointer',whiteSpace:'nowrap',flexShrink:0}}>
              📲 安裝
            </button>
          )}
          <button onClick={()=>setInstallDismissed(true)}
            style={{background:'none',border:'none',color:'#64748b',fontSize:18,
              cursor:'pointer',padding:'2px 4px',lineHeight:1,flexShrink:0}}>✕</button>
        </div>
      )}

      {/* ══ 主體（側欄 + 檢視器）══ */}
      <div style={{display:'flex',flex:1,overflow:'hidden',position:'relative'}}>
        {/* 手機遮罩 */}
        {sidebarOpen&&(
          <div onClick={()=>setSidebarOpen(false)}
            style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.55)',zIndex:199}}
            className="mob-overlay"/>
        )}

      {/* ── SIDEBAR ── */}
      <div style={{
        width:210,flexShrink:0,background:'#0d1020',borderRight:'1px solid #1e2a3e',
        overflowY:'auto',display:'flex',flexDirection:'column',
        position:'relative',zIndex:200,
        // On mobile: absolute + slide in/out
        ...(typeof window!=='undefined'&&window.innerWidth<=640?{
          position:'fixed',top:0,bottom:0,left:0,
          transform:sidebarOpen?'translateX(0)':'translateX(-100%)',
          transition:'transform .25s ease',
          boxShadow:sidebarOpen?'4px 0 20px rgba(0,0,0,0.5)':'none',
        }:{
          display:sidebarOpen?'flex':'none',
        })
      }}>
        <div style={{padding:'14px 12px 10px',borderBottom:'1px solid #1e2a3e',
          display:'flex',alignItems:'center',justifyContent:'space-between'}}>
          <div>
            <div style={{fontSize:11,fontWeight:900,letterSpacing:3,color:'#38bdf8',textTransform:'uppercase'}}>分子結構</div>
            <div style={{fontSize:9,color:'#475569',marginTop:2,letterSpacing:1}}>3D Viewer</div>
          </div>
          <button onClick={()=>setSidebarOpen(false)}
            style={{background:'none',border:'none',color:'#475569',fontSize:18,cursor:'pointer',padding:'2px 4px'}}>✕</button>
        </div>
        <div style={{flex:1,overflowY:'auto'}}>
          {cats.map(cat=>(
            <div key={cat}>
              <button onClick={()=>toggleCat(cat)}
                style={{width:'100%',display:'flex',alignItems:'center',gap:6,padding:'7px 12px',
                  background:'none',border:'none',cursor:'pointer',
                  color:openCat===cat?'#7dd3fc':'#64748b',fontSize:11,fontWeight:700,
                  borderLeft:openCat===cat?'3px solid #38bdf8':'3px solid transparent',textAlign:'left'}}>
                <span>{ICONS[cat]||'🔬'}</span>
                <span style={{flex:1,letterSpacing:0.3}}>{cat}</span>
                <span style={{fontSize:9,opacity:0.6}}>{openCat===cat?'▲':'▼'}</span>
              </button>
              {openCat===cat&&(
                <div style={{background:'rgba(0,0,0,0.2)'}}>
                  {CAT[cat].map((m,idx)=>(
                    <button key={idx} onClick={()=>{setSelMol(m);if(window.innerWidth<=640)setSidebarOpen(false);}}
                      style={{width:'100%',padding:'5px 10px 5px 22px',background:selMol===m?'rgba(56,189,248,0.1)':'none',
                        border:'none',cursor:'pointer',textAlign:'left',
                        borderLeft:selMol===m?'2px solid #38bdf8':'2px solid transparent',
                        color:selMol===m?'#7dd3fc':'#64748b',fontSize:10.5}}>
                      <span style={{fontFamily:'monospace',fontWeight:600,fontSize:11}}>{m.formula}</span>
                      <span style={{display:'block',fontSize:9.5,opacity:0.7,marginTop:1}}>{m.name}</span>
                    </button>
                  ))}
                </div>
              )}
            </div>
          ))}
        </div>
      </div>

      {/* ── VIEWER AREA ── */}
      <div style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden',minWidth:0}}>
        {/* Header bar */}
        <div style={{padding:'7px 10px',borderBottom:'1px solid #1e2a3e',background:'#0d1020',
          display:'flex',alignItems:'center',gap:6,flexWrap:'wrap',flexShrink:0}}>
          {/* Hamburger */}
          <button onClick={()=>setSidebarOpen(v=>!v)}
            style={{background:'none',border:'1px solid #334155',borderRadius:6,color:'#94a3b8',
              fontSize:16,cursor:'pointer',padding:'4px 8px',lineHeight:1,flexShrink:0}}>
            ☰
          </button>
          {/* Molecule info */}
          <div style={{minWidth:0,flex:1}}>
            <span style={{fontSize:16,fontWeight:900,fontFamily:'monospace',color:'#38bdf8'}}>{selMol?.formula}</span>
            <span style={{fontSize:12,color:'#94a3b8',marginLeft:7,display:'inline'}}>{selMol?.name}</span>
          </div>
          {/* Tool buttons */}
          <div style={{display:'flex',gap:5,flexShrink:0,flexWrap:'wrap'}}>
            {/* Bond angle button */}
            <button onClick={()=>setShowAngles(v=>!v)}
              style={{display:'flex',alignItems:'center',gap:4,padding:'4px 10px',borderRadius:7,
                cursor:'pointer',fontSize:11,fontWeight:700,border:'1px solid',transition:'all .15s',
                background:showAngles?'rgba(251,191,36,0.15)':'rgba(255,255,255,0.04)',
                borderColor:showAngles?'#fbbf24':'#334155',
                color:showAngles?'#fbbf24':'#64748b'}}>
              <span style={{fontSize:13}}>📐</span>
              {showAngles?'隱藏鍵角':'顯示鍵角'}
            </button>
          </div>
        </div>

        {/* 3D Canvas area */}
        <div style={{flex:1,position:'relative',overflow:'hidden'}}>
          <Viewer mol={selMol} showAngles={showAngles}/>
          {selMol?.note&&(
            <div style={{position:'absolute',bottom:0,left:0,right:0,padding:'6px 14px',
              background:'linear-gradient(transparent,rgba(10,13,20,0.96))',fontSize:11,color:'#94a3b8',lineHeight:1.5}}>
              <span style={{color:'#38bdf8',fontWeight:700,marginRight:6}}>📌</span>{selMol.note}
            </div>
          )}
        </div>

        {/* CPK Legend bar */}
        <div style={{padding:'5px 12px',borderTop:'1px solid #1e2a3e',background:'#0d1020',
          display:'flex',flexWrap:'wrap',gap:'4px 10px',alignItems:'center',flexShrink:0}}>
          <span style={{fontSize:9,color:'#475569',letterSpacing:1,textTransform:'uppercase',marginRight:2}}>CPK</span>
          {LEGEND.map(([sym,zh,col])=>(
            <span key={sym} style={{display:'flex',alignItems:'center',gap:3}}>
              <span style={{width:8,height:8,borderRadius:'50%',background:col,
                border:sym==='H'?'1px solid #555':'none',display:'inline-block',flexShrink:0}}/>
              <span style={{fontSize:9,color:'#94a3b8'}}>{zh}</span>
            </span>
          ))}
        </div>
      </div>{/* end VIEWER AREA */}
      </div>{/* end 主體 flex row */}

      {/* React-side install button handler */}
      <InstallHandler/>
    </div>
  );
}

// Wires up the "安裝" button rendered in the banner to the native PWA prompt
function InstallHandler(){
  useEffect(()=>{
    let prompt=null;
    const handler=e=>{e.preventDefault();prompt=e;};
    window.addEventListener('beforeinstallprompt',handler);
    const btn=document.getElementById('react-install-btn');
    if(btn) btn.onclick=()=>{if(prompt){prompt.prompt();prompt=null;}};
    return()=>window.removeEventListener('beforeinstallprompt',handler);
  },[]);
  return null;
}

// Mount
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(App));
document.getElementById('loading').style.display = 'none';
  </script>
